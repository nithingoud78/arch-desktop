# ==============================================================================
# Master Purple / Lavender Dark — Kitty Terminal Configuration
# ==============================================================================

# --- Typography ---
font_family      Adwaita Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.5

# --- Window Appearance & Padding ---
window_padding_width 14
hide_window_decorations yes
confirm_os_window_close 0
remember_window_size    yes
initial_window_width    920
initial_window_height   560

# --- Background & Transparency ---
background         #161022
foreground         #FDFBFE
background_opacity 0.90
background_blur    1

# --- Cursor ---
cursor                #C084FC
cursor_text_color     #161022
cursor_shape          beam
cursor_blink_interval 0.5
cursor_stop_blinking_after 15.0

# --- Selection ---
selection_foreground #FDFBFE
selection_background #3B2252

# --- Smooth Scrolling ---
scrollback_lines 8000
wheel_scroll_multiplier 3.0
touch_scroll_multiplier 3.0

# --- Sound & Bells ---
enable_audio_bell no
visual_bell_duration 0.0

# --- URLs ---
url_color #C084FC
url_style curly
open_url_with default
detect_urls yes

# --- Master Purple Theme Color Palette ---
# Black
color0 #1A1226
color8 #4A3B5C

# Red / Pink
color1 #F43F5E
color9 #FB7185

# Green
color2  #4ADE80
color10 #86EFAC

# Yellow
